name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be mid-deploy. Newer pushes queue behind it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Preview deploy of the client for same-repo pull requests (non-production Worker version).
  # Skipped for forks: they get no secrets.
  deploy-preview:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build client
        run: npm run build -w client

      - name: Upload preview version
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          workingDirectory: client
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

  # Production deploy of the client on push to main. Waits for approval of the `production`
  # GitHub Environment (required reviewers, configured by a human).
  deploy-production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build client
        run: npm run build -w client

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          workingDirectory: client
          command: deploy

  # Triggers a deploy of the API on Render through its Deploy Hook (secret RENDER_DEPLOY_HOOK_URL).
  # Independent of deploy-production (client): both wait for approval of the `production` environment,
  # approve this one first when an API contract changes. No checkout or install needed.
  deploy-api:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set."
            exit 1
          fi
          # --fail turns non-2xx into a failure; -sS hides progress but keeps errors; the URL is never printed.
          curl --fail -sS -o /dev/null --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL" \
            || { echo "::error::Render deploy hook request failed."; exit 1; }
          echo "Render deploy triggered (the build continues on Render)."

      # Reachability check only: the hook returns before the build finishes, so this may still hit the
      # old instance. Skipped unless the repository variable API_ORIGIN is set. Retries cover a cold start.
      - name: Check API health
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "API_ORIGIN variable not set; skipping health check."
            exit 0
          fi
          for i in $(seq 1 12); do
            if curl --fail -sS -o /dev/null --max-time 20 "${API_ORIGIN%/}/api/v1/health"; then
              echo "API healthy."
              exit 0
            fi
            echo "Attempt $i/12 failed; retrying in 10 s."
            sleep 10
          done
          echo "::error::API health check failed after 12 attempts."
          exit 1
